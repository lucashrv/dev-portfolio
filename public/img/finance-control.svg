<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cardFin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgFin)"/>

  <!-- Top Bar -->
  <rect x="40" y="30" width="720" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <circle cx="70" cy="60" r="14" fill="#10b981"/>
  <text x="95" y="66" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold">Finance Control Dashboard</text>
  <text x="350" y="65" fill="#94a3b8" font-family="Arial" font-size="12">Gestão Financeira • React, Redux &amp; PostgreSQL</text>
  <rect x="630" y="45" width="105" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="648" y="65" fill="#34d399" font-family="Arial" font-size="12" font-weight="bold">Em Dia</text>

  <!-- Metric 1: Saldo -->
  <rect x="40" y="110" width="220" height="100" rx="12" fill="url(#cardFin)" stroke="#334155"/>
  <text x="60" y="140" fill="#94a3b8" font-family="Arial" font-size="12">Saldo Atual</text>
  <text x="60" y="175" fill="#10b981" font-family="Arial" font-size="22" font-weight="bold">R$ 28.450,00</text>
  <text x="60" y="195" fill="#34d399" font-family="Arial" font-size="11">▲ +14% em relação ao mês anterior</text>

  <!-- Metric 2: Receitas -->
  <rect x="290" y="110" width="220" height="100" rx="12" fill="url(#cardFin)" stroke="#334155"/>
  <text x="310" y="140" fill="#94a3b8" font-family="Arial" font-size="12">Receitas (Mês)</text>
  <text x="310" y="175" fill="#38bdf8" font-family="Arial" font-size="22" font-weight="bold">R$ 15.200,00</text>
  <text x="310" y="195" fill="#94a3b8" font-family="Arial" font-size="11">4 entradas registradas</text>

  <!-- Metric 3: Despesas -->
  <rect x="540" y="110" width="220" height="100" rx="12" fill="url(#cardFin)" stroke="#334155"/>
  <text x="560" y="140" fill="#94a3b8" font-family="Arial" font-size="12">Despesas (Mês)</text>
  <text x="560" y="175" fill="#f43f5e" font-family="Arial" font-size="22" font-weight="bold">R$ 4.750,00</text>
  <text x="560" y="195" fill="#94a3b8" font-family="Arial" font-size="11">12 saídas categorizadas</text>

  <!-- Chart Area -->
  <rect x="40" y="230" width="720" height="235" rx="12" fill="#0b0f19" stroke="#334155"/>
  <text x="65" y="265" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Evolução de Fluxo de Caixa (Últimos 6 Meses)</text>

  <!-- Chart area lines -->
  <line x1="65" y1="420" x2="735" y2="420" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="65" y1="360" x2="735" y2="360" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="65" y1="300" x2="735" y2="300" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Area curve -->
  <path d="M 80 410 Q 180 390 280 340 T 480 320 T 620 285 T 720 270 L 720 420 L 80 420 Z" fill="url(#chartGrad)"/>
  <path d="M 80 410 Q 180 390 280 340 T 480 320 T 620 285 T 720 270" fill="none" stroke="#10b981" stroke-width="4"/>

  <!-- Data points -->
  <circle cx="280" cy="340" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="480" cy="320" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="620" cy="285" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="720" cy="270" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

  <!-- Months labels -->
  <text x="75" y="445" fill="#64748b" font-family="Arial" font-size="11">Jan</text>
  <text x="200" y="445" fill="#64748b" font-family="Arial" font-size="11">Fev</text>
  <text x="325" y="445" fill="#64748b" font-family="Arial" font-size="11">Mar</text>
  <text x="450" y="445" fill="#64748b" font-family="Arial" font-size="11">Abr</text>
  <text x="575" y="445" fill="#64748b" font-family="Arial" font-size="11">Mai</text>
  <text x="700" y="445" fill="#10b981" font-family="Arial" font-size="11" font-weight="bold">Jun</text>
</svg>
