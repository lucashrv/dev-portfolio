<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="cardEcom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#824ee4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgEcom)"/>

  <!-- Top App Bar -->
  <rect x="40" y="30" width="720" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <circle cx="70" cy="60" r="14" fill="#824ee4"/>
  <text x="95" y="66" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold">E-Commerce Enterprise</text>
  <text x="320" y="65" fill="#94a3b8" font-family="Arial" font-size="12">React • Redux • Node • Sequelize • PostgreSQL</text>
  <rect x="630" y="45" width="105" height="30" rx="8" fill="#824ee4"/>
  <text x="645" y="65" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">Carrinho (3)</text>

  <!-- Product Card 1 -->
  <rect x="40" y="115" width="220" height="230" rx="12" fill="url(#cardEcom)" stroke="#334155"/>
  <rect x="55" y="130" width="190" height="110" rx="8" fill="#334155"/>
  <circle cx="150" cy="185" r="28" fill="#824ee4" fill-opacity="0.3"/>
  <text x="55" y="265" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">MacBook Pro M3</text>
  <text x="55" y="285" fill="#94a3b8" font-family="Arial" font-size="11">Eletrônicos • Em estoque</text>
  <text x="55" y="320" fill="#a855f7" font-family="Arial" font-size="16" font-weight="bold">R$ 14.499,00</text>

  <!-- Product Card 2 -->
  <rect x="290" y="115" width="220" height="230" rx="12" fill="url(#cardEcom)" stroke="#334155"/>
  <rect x="305" y="130" width="190" height="110" rx="8" fill="#334155"/>
  <circle cx="400" cy="185" r="28" fill="#3b82f6" fill-opacity="0.3"/>
  <text x="305" y="265" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Monitor Dell 4K 32&quot;</text>
  <text x="305" y="285" fill="#94a3b8" font-family="Arial" font-size="11">Periféricos • Em estoque</text>
  <text x="305" y="320" fill="#a855f7" font-family="Arial" font-size="16" font-weight="bold">R$ 3.890,00</text>

  <!-- Product Card 3 -->
  <rect x="540" y="115" width="220" height="230" rx="12" fill="url(#cardEcom)" stroke="#334155"/>
  <rect x="555" y="130" width="190" height="110" rx="8" fill="#334155"/>
  <circle cx="650" cy="185" r="28" fill="#10b981" fill-opacity="0.3"/>
  <text x="555" y="265" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Teclado Mecânico Keychron</text>
  <text x="555" y="285" fill="#94a3b8" font-family="Arial" font-size="11">Acessórios • Em estoque</text>
  <text x="555" y="320" fill="#a855f7" font-family="Arial" font-size="16" font-weight="bold">R$ 789,00</text>

  <!-- Bottom Architecture Diagram Banner -->
  <rect x="40" y="365" width="720" height="105" rx="12" fill="#0b0f19" stroke="#824ee4" stroke-width="1.5"/>
  <text x="65" y="395" fill="#824ee4" font-family="Arial" font-size="12" font-weight="bold">ARQUITETURA DE DADOS &amp; BACKEND</text>
  <text x="65" y="420" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Redux Store ➔ REST API (Node/Express) ➔ Sequelize ORM ➔ PostgreSQL Database</text>
  <text x="65" y="445" fill="#94a3b8" font-family="Arial" font-size="11">Transações atômicas ACID para pagamentos e pedidos, validação rigorosa de schemas e segurança JWT.</text>
</svg>
